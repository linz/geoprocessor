version: 2
updates:
  - package-ecosystem: docker
    directories:
      - /
    open-pull-requests-limit: 5
    schedule:
      interval: weekly
      day: monday
      time: "07:30"
      timezone: Pacific/Auckland
    cooldown:
      default-days: 15
      exclude:
        # Our base images: their conda-forge updates already waited for pixi's exclude-newer, so don't delay them again
        - linz/*
    commit-message:
      prefix: build(deps)

  - package-ecosystem: github-actions
    directories:
      - /
    open-pull-requests-limit: 5
    schedule:
      interval: weekly
      day: monday
      time: "07:30"
      timezone: Pacific/Auckland
    cooldown:
      default-days: 15
    commit-message:
      prefix: build(deps)
    groups:
      actions-minor-and-patch:
        applies-to: version-updates
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: uv
    directories:
      - /
    open-pull-requests-limit: 5
    schedule:
      interval: weekly
      day: monday
      time: "07:30"
      timezone: Pacific/Auckland
    cooldown:
      default-days: 15
    commit-message:
      prefix: build(deps)
    groups:
      uv-minor-and-patch:
        applies-to: version-updates
        patterns: ["*"]
        update-types: [minor, patch]
