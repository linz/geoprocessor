name: Containers

on:
  workflow_call:
    inputs:
      publish:
        description: >-
          Which tags to push:
          "" (empty string) to build and test without pushing
          "commit" pushes latest and the `git describe` version
          "release" adds the major and major.minor tags
          "pr" pushes pr-<number>
        type: string
        default: ""

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - container: raster
          - container: pointcloud
    environment: ${{ inputs.publish != '' && 'prod' || '' }}
    permissions:
      id-token: write
      contents: read
      packages: write
    env:
      AWS_CI_ROLE: ${{ secrets.AWS_CI_ROLE }}
      IMAGE: local-${{ matrix.container }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup GIT version
        id: version
        run: |
          GIT_VERSION=$(git describe --tags --always --match 'v*')
          GIT_VERSION_MAJOR=$(echo "$GIT_VERSION" | cut -d. -f1)
          GIT_VERSION_MAJOR_MINOR=$(echo "$GIT_VERSION" | cut -d. -f1,2)
          { echo "version=${GIT_VERSION}"; echo "version_major=${GIT_VERSION_MAJOR}"; echo "version_major_minor=${GIT_VERSION_MAJOR_MINOR}"; } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ github.repository }}/${{ matrix.container }}
          labels: |
            org.opencontainers.image.version=${{ steps.version.outputs.version }}

      - name: Build container
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile.${{ matrix.container }}
          # Loaded into the local daemon instead of pushed: the tests below run against this
          # exact image, and the push step tags the same image rather than building again.
          load: true
          tags: ${{ env.IMAGE }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GIT_HASH=${{ github.sha }}
            GIT_VERSION=${{ steps.version.outputs.version }}
            GITHUB_RUN_ID=${{ github.run_id }}

      - name: End to end tests
        run: ./e2e/${{ matrix.container }}.sh "$IMAGE" "${{ runner.temp }}/e2e"

      - name: Keep the output of a failed test run
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: ${{ matrix.container }}-e2e-output
          path: ${{ runner.temp }}/e2e
          retention-days: 7
          if-no-files-found: ignore

      - name: Login to GitHub Container Registry
        if: ${{ inputs.publish != '' }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure AWS Credentials
        if: ${{ inputs.publish != '' && env.AWS_CI_ROLE != '' }}
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          aws-region: ap-southeast-2
          mask-aws-account-id: true
          role-to-assume: ${{ env.AWS_CI_ROLE }}

      - name: Login to Amazon ECR
        id: login-ecr
        if: ${{ inputs.publish != '' && env.AWS_CI_ROLE != '' }}
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7

      - name: Push the tested image
        if: ${{ inputs.publish != '' }}
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          PUBLISH: ${{ inputs.publish }}
          VERSION: ${{ steps.version.outputs.version }}
          VERSION_MAJOR: ${{ steps.version.outputs.version_major }}
          VERSION_MAJOR_MINOR: ${{ steps.version.outputs.version_major_minor }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          case "$PUBLISH" in
            commit) tags=(latest "$VERSION") ;;
            release) tags=(latest "$VERSION_MAJOR" "$VERSION_MAJOR_MINOR" "$VERSION") ;;
            pr) tags=("pr-${PR_NUMBER}") ;;
            *) echo "::error::unknown publish value '${PUBLISH}'"; exit 1 ;;
          esac

          # ghcr namespaces by owner, ECR does not.
          repositories=("ghcr.io/${{ github.repository }}/${{ matrix.container }}")
          if [[ -n "$ECR_REGISTRY" ]]; then
            repositories+=("${ECR_REGISTRY}/${GITHUB_REPOSITORY#*/}/${{ matrix.container }}")
          fi

          for repository in "${repositories[@]}"; do
            for tag in "${tags[@]}"; do
              docker tag "$IMAGE" "${repository}:${tag}"
              docker push "${repository}:${tag}"
            done
          done
