name: Containers

on:
  workflow_call:
    inputs:
      publish:
        description: >-
          Which tags to push:
          "" (empty string) to build and test without pushing
          "commit" pushes latest and the `git describe` version
          "release" adds the major and major.minor tags
          "pr" pushes pr-<number>
        type: string
        default: ""

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - container: raster
          - container: pointcloud
    environment: ${{ inputs.publish != '' && 'prod' || '' }}
    permissions:
      id-token: write
      contents: read
      packages: write
    env:
      AWS_CI_ROLE: ${{ secrets.AWS_CI_ROLE }}
      IMAGE: local-${{ matrix.container }}
    steps:
      - name: Checkout
        uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3
        with:
          fetch-depth: 0

      - name: Setup GIT version
        id: version
        run: |
          GIT_VERSION=$(git describe --tags --always --match 'v*')
          GIT_VERSION_MAJOR=$(echo "$GIT_VERSION" | cut -d. -f1)
          GIT_VERSION_MAJOR_MINOR=$(echo "$GIT_VERSION" | cut -d. -f1,2)
          { echo "version=${GIT_VERSION}"; echo "version_major=${GIT_VERSION_MAJOR}"; echo "version_major_minor=${GIT_VERSION_MAJOR_MINOR}"; } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@885d1462b80bc1c1c7f0b00334ad271f09369c55 # v2

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@818d4b7b91585d195f67373fd9cb0332e31a7175 # v4
        with:
          images: ${{ github.repository }}/${{ matrix.container }}
          labels: |
            org.opencontainers.image.version=${{ steps.version.outputs.version }}

      - name: Build container
        uses: docker/build-push-action@0a97817b6ade9f46837855d676c4cca3a2471fc9 # v4
        with:
          context: .
          file: Dockerfile.${{ matrix.container }}
          # Loaded into the local daemon instead of pushed: the tests below run against this
          # exact image, and the push step tags the same image rather than building again.
          load: true
          tags: ${{ env.IMAGE }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GIT_HASH=${{ github.sha }}
            GIT_VERSION=${{ steps.version.outputs.version }}
            GITHUB_RUN_ID=${{ github.run_id }}

      - name: End to end tests
        run: ./e2e/${{ matrix.container }}.sh "$IMAGE" "${{ runner.temp }}"

      - name: Keep the output of a failed test run
        uses: actions/upload-artifact@v4.6.0
        if: failure()
        with:
          name: ${{ matrix.container }}-e2e-output
          path: |
            ${{ runner.temp }}/**/*.tiff
            ${{ runner.temp }}/**/*.geojson
            ${{ runner.temp }}/*.log
          retention-days: 7
          if-no-files-found: ignore

      - name: Login to GitHub Container Registry
        if: ${{ inputs.publish != '' }}
        uses: docker/login-action@465a07811f14bebb1938fbed4728c6a1ff8901fc # v2
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure AWS Credentials
        if: ${{ inputs.publish != '' && env.AWS_CI_ROLE != '' }}
        uses: aws-actions/configure-aws-credentials@5fd3084fc36e372ff1fff382a39b10d03659f355 # v2
        with:
          aws-region: ap-southeast-2
          mask-aws-account-id: true
          role-to-assume: ${{ env.AWS_CI_ROLE }}

      - name: Login to Amazon ECR
        id: login-ecr
        if: ${{ inputs.publish != '' && env.AWS_CI_ROLE != '' }}
        uses: aws-actions/amazon-ecr-login@2fc7aceee09e9e4a7105c0d060c656fad0b4f63d # v1

      - name: Push the tested image
        if: ${{ inputs.publish != '' }}
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          PUBLISH: ${{ inputs.publish }}
          VERSION: ${{ steps.version.outputs.version }}
          VERSION_MAJOR: ${{ steps.version.outputs.version_major }}
          VERSION_MAJOR_MINOR: ${{ steps.version.outputs.version_major_minor }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          case "$PUBLISH" in
            commit) tags=(latest "$VERSION") ;;
            release) tags=(latest "$VERSION_MAJOR" "$VERSION_MAJOR_MINOR" "$VERSION") ;;
            pr) tags=("pr-${PR_NUMBER}") ;;
            *) echo "::error::unknown publish value '${PUBLISH}'"; exit 1 ;;
          esac

          # ghcr namespaces by owner, ECR does not.
          repositories=("ghcr.io/${{ github.repository }}/${{ matrix.container }}")
          if [[ -n "$ECR_REGISTRY" ]]; then
            repositories+=("${ECR_REGISTRY}/${GITHUB_REPOSITORY#*/}/${{ matrix.container }}")
          fi

          for repository in "${repositories[@]}"; do
            for tag in "${tags[@]}"; do
              docker tag "$IMAGE" "${repository}:${tag}"
              docker push "${repository}:${tag}"
            done
          done
