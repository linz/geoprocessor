name: Format and Tests
on:
  push:
  pull_request:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12.3"
      - name: Sync uv
        run: |
          uv sync --frozen --no-install-project
      - name: Format
        run: |
          uv run pre-commit run --all-files
      - name: Unit Tests
        run: |
          for pkg in packages/*/; do
            [ -d "${pkg}test" ] || continue
            uv run pytest --doctest-modules "$pkg"
          done

  containers:
    # Build, end to end test and (on master) publish the container.
    # Runs after the unit tests so that a failure there stops an image being pushed.
    needs: build
    permissions:
      id-token: write
      contents: read
      packages: write
    uses: ./.github/workflows/containers.yml
    secrets: inherit
    with:
      publish: ${{ (github.ref == 'refs/heads/master' && !startsWith(github.event.head_commit.message, 'release:')) && 'commit' || '' }}
