name: Format and Tests
on:
  push:
  pull_request:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.6" # keep in sync with the uv image in Dockerfile.*
          python-version: "3.12.3"
      - name: Sync uv
        run: |
          uv sync --locked --no-install-project
      - name: Format
        run: |
          uv run pre-commit run --all-files
      - name: Unit Tests
        run: |
          for pkg in packages/*/; do
            [ -d "${pkg}test" ] || continue
            uv run pytest --doctest-modules "$pkg"
          done

  containers:
    # Build, end to end test and (on master) publish the container.
    # Runs after the unit tests so that a failure there stops an image being pushed.
    needs: build
    permissions:
      id-token: write
      contents: read
      packages: write
    uses: ./.github/workflows/containers.yml
    secrets: inherit
    with:
      publish: ${{ (github.ref == 'refs/heads/master' && !startsWith(github.event.head_commit.message, 'release:')) && 'commit' || '' }}
