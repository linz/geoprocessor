[build-system]
requires = ["uv_build>=0.11.14,<0.12.0"]
build-backend = "uv_build"

[project]
name = "geoprocessor-common"
version = "0.1.2"
description = "Shared utilities for LINZ geoprocessor"
requires-python = "~=3.12.3"
dependencies = [
    "boto3",
    "linz-logger",
    "py-multihash",
    "python-dateutil",
    "shapely>=2.0",
]

[dependency-groups]
dev = [
    "moto>=4.2",
    "mypy-boto3-s3",
    "pytest",
    "pytest-dependency",
    "pytest-subtests",
]

[tool.uv]
package = true
