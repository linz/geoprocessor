[build-system]
requires = ["uv_build>=0.11.14,<0.12.0"]
build-backend = "uv_build"

[project]
name = "geoprocessor-raster"
version = "0.1.1"
description = "Command line tools for raster (GDAL) LINZ geoprocessor workflows"
requires-python = "~=3.12.3"
dependencies = [
    "geoprocessor-common",
    "geoprocessor-gdal",
    "geoprocessor-stac",
    "linz-logger",
]

[project.scripts]
collection-from-items = "geoprocessor_raster.collection_from_items:main"
generate-hillshade = "geoprocessor_raster.generate_hillshade:main"
standardise-validate = "geoprocessor_raster.standardise_validate:main"
thumbnails = "geoprocessor_raster.thumbnails:main"
translate-ascii = "geoprocessor_raster.translate_ascii:main"

[dependency-groups]
dev = [
    "moto>=4.2",
    "mypy-boto3-s3",
    "pytest",
    "pytest-dependency",
    "pytest-subtests",
]

[tool.pytest.ini_options]
testpaths = ["test"]
pythonpath = ["test"]

[tool.uv]
package = true

[tool.uv.sources]
geoprocessor-common = { workspace = true }
geoprocessor-gdal = { workspace = true }
geoprocessor-stac = { workspace = true }
