[build-system]
requires = ["uv_build>=0.11.14,<0.12.0"]
build-backend = "uv_build"

[project]
name = "geoprocessor-stac"
version = "0.1.2"
description = "STAC utilities for LINZ geoprocessor workflows"
requires-python = "~=3.12.3"
dependencies = [
    "boto3",
    "geoprocessor-common",
    "linz-logger",
    "python-ulid",
    "shapely>=2.0",
]

[dependency-groups]
dev = [
    "moto>=4.2",
    "mypy-boto3-s3",
    "pytest",
    "pytest-subtests",
]

[tool.pytest.ini_options]
testpaths = ["test"]
pythonpath = ["test"]

[tool.uv]
package = true

[tool.uv.sources]
geoprocessor-common = { workspace = true }
