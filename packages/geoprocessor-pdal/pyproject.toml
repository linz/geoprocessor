[build-system]
requires = ["uv_build>=0.11.14,<0.12.0"]
build-backend = "uv_build"

[project]
name = "geoprocessor-pdal"
version = "0.1.2"
description = "PDAL utilities for LINZ geoprocessor workflows"
requires-python = "~=3.12.3"
dependencies = [
    "geoprocessor-common",
    "linz-logger",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-dependency",
    "pytest-subtests",
]

[tool.pytest.ini_options]
testpaths = ["test"]
pythonpath = ["test"]

[tool.uv]
package = true

[tool.uv.sources]
geoprocessor-common = { workspace = true }
